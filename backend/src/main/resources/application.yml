spring:
  application:
    name: adventure-book

  datasource:
    url: jdbc:h2:file:./data/adventure-book
    username: sa

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
  show-sql: true
  properties:
    hibernate:
      format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  mapdb:
    path: ./data/adventure-book.mapdb